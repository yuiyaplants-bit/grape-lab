      <div class="pairs">${ranked.map(([k,v])=>`<div class="pair"><span>${icons[k]||""} ${k}</span><b>${v.toFixed(1)}</b></div>`).join('')}</div>
    </div>
    <div class="section"><h3>出典</h3>${g.facts.出典.map(x=>`<div class="small">• ${x}</div>`).join('')}</div>`;
  dlg.showModal();
}
q.oninput=render;s.onchange=render;renderCookChips();render();
</script></body></html>
