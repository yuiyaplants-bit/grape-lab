function rows(){let q=$("#q").value.trim();let st=$("#status").value;let a=grapes.filter(g=>(!q||JSON.stringify(g).includes(q))&&(!st||g.status===st)&&(active==="すべて"||g.color===active||g.skin===active||g.seed===active));let s=$("#sort").value;if(s==="sweet")a.sort((a,b)=>b.sweet-a.sweet);else if(s==="unique")a.sort((a,b)=>b.unique-a.unique);else a.sort((a,b)=>a.name.localeCompare(b.name,"ja"));return a}
function render(){let a=rows();count.textContent=`${a.length} / 120品種`;grid.innerHTML=a.map(g=>`<article class="card" data-n="${g.name}"><div class="row"><div class="name">${g.name}</div><div><span class="badge">${g.color}</span> <span class="status ${g.status}">${g.status}</span></div></div><div class="tags"><span class="tag">${g.skin}</span><span class="tag">${g.seed}</span></div><div class="metrics"><div class="m"><b>${g.sweet}</b><small>甘味</small></div><div class="m"><b>${g.acid}</b><small>酸味</small></div><div class="m"><b>${g.aroma}</b><small>香り</small></div><div class="m"><b>${g.unique}</b><small>個性</small></div></div></article>`).join("");document.querySelectorAll(".card").forEach(c=>c.onclick=()=>openG(grapes.find(g=>g.name===c.dataset.n)))}
function openG(g){detail.innerHTML=`<button class="close" onclick="dlg.close()">×</button><div class="row"><div><h2>${g.name}</h2><div class="source">${g.color}｜${g.skin}｜${g.seed}</div></div><span class="status ${g.status}">${g.status}</span></div><section class="section"><h3>図鑑プロフィール</h3><p>甘味 ${g.sweet} / 酸味 ${g.acid} / 香り ${g.aroma} / 個性 ${g.unique}</p><p class="source">※Ver.0.2では120品種を揃えることを優先。精査済以外の数値は比較用の暫定編集値を含みます。</p></section><div class="ai"><b>AI料理適性予測</b><div class="pairs">${Object.entries(g.cooking).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="pair"><span>${k}</span><b>${v}</b></div>`).join("")}</div></div><section class="section"><h3>次の精査対象</h3><div class="source">交配親 / 育成者 / 熟期 / 粒重 / 房重 / 糖度 / 酸 / 果肉 / 香り / 裂果 / 樹勢 / 貯蔵性 / 一次資料リンクを順次追加。</div></section>`;dlg.showModal()}
